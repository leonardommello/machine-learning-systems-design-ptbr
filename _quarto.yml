project:
  type: website
  output-dir: _site
  # Sem esta lista, o Quarto renderiza todo markdown do repositório — o que
  # publicaria o booklet inteiro, em inglês e traduzido. A obra é da autora e
  # não tem licença aberta: ela pertence ao repositório dela, não a um espelho.
  # O site publica apenas as páginas do projeto de tradução.
  render:
    - index.qmd
    - ESTADO-DA-TRADUCAO.md
    - GLOSSARIO.md

website:
  title: "Machine Learning Systems Design — tradução PT-BR"
  description: "Projeto de tradução para português do Brasil do booklet de Chip Huyen"
  search: true
  page-navigation: true
  repo-url: https://github.com/leonardommello/machine-learning-systems-design-ptbr
  repo-actions: [source, issue]
  navbar:
    left:
      - href: index.qmd
        text: Início
      - href: ESTADO-DA-TRADUCAO.md
        text: Estado da tradução
      - href: GLOSSARIO.md
        text: Glossário
    right:
      - icon: github
        href: https://github.com/leonardommello/machine-learning-systems-design-ptbr
  sidebar:
    style: docked
    contents:
      - index.qmd
      - ESTADO-DA-TRADUCAO.md
      - GLOSSARIO.md
  page-footer:
    left: |
      Booklet original © Chip Huyen. Todos os direitos reservados.
    right: |
      Projeto de tradução não oficial mantido pela comunidade.

lang: pt

format:
  html:
    theme:
      light: [cosmo, assets/theme.scss]
      dark: [darkly, assets/theme-dark.scss]
    code-copy: true
    code-overflow: wrap
    toc: true
    toc-title: "Nesta página"
    link-external-newwindow: true

execute:
  enabled: false
  freeze: true
